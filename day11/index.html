<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list and anchor tag ko styling...</title>

    <style>
        *{
            margin: 0;
            padding: 0;
        }

        a{
            color: black;
            text-decoration: none;
        }

        ul li{
            list-style-type: none;
            background-color: green;
            display: inline;
        }

        div{
            background-color: red;
            display: inline;

        }
        span{
            background-color: yellow;
            display: block;
        }
    </style>
</head>
<body>
    
    <!-- styling list elements -->
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
    </ul>

    <!-- 
    display property:

    inline-block - mixture of block and inline
    block - div
    inline - span
    -->

    <div>i am a div</div>
    <span>i am a span</span>

</body>
</html>
