<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>responsive in css</title>

    <style>
        .container{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            gap: 5px;
        }
        .box{
            height: 300px;
            width: 300px;
            background-color: red;
            
        }
        h1{
            font-size: 5rem;
        }

        /* responsive design */
        

        @media (max-width:800px) {
            .container{
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
            }
            .box{
                background-color: orange;
            }
            h1{
                font-size: 3rem;
            }
            
        }

        /* 500px -> mobile screen */
        @media (max-width:500px) {
            /* .container{
                flex-direction: column;
            } */
             .container{
                display: grid;
                grid-template-columns: 1fr;
             }
            .box{
                background-color: green;
                height: 300px;
            }
            h1{
                font-size: 32px;
            }
        }

        
    </style>
</head>
<body>
    <h1>Hello There</h1>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
