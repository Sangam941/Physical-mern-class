<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>selectors in html</title>
    <style>
        /* tag selectors */
        h1{
            color: aqua;
        }

        p{
            color: red;
        }

        div{
            color: green;
        }

        /* class selector */
        
        .para{
            background-color: yellow;
            color: red;
        }
        .green{
            background-color: green;
        }

        /* id selector */
        #purple{
            background-color: purple;
        }
    </style>
</head>
<body>
    
    <h1>h1</h1>
    <p>paragraph</p>
    <div>i am div</div>

    <p class="para green">hello</p>
    <p class="para">hello</p>
    <p class="para green">hello</p>
    <p class="para">hello</p>
    <p id="purple">hello</p>

</body>
</html>
