<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form in html</title>
  </head>
  <body>
    <!-- method  GET, POST -->

    <!-- GET -> fetch data
        POST -> send data to bakend 
    -->
    <form action="" method="POST">
      <div>
        <label for="firstname">Firstname: </label>
        <input type="text" id="firstname" placeholder="Enter your firstname" required/>
      </div>

      <div>
        <label for="lastname">Lastname:</label>
        <input type="text" id="lastname" placeholder="Enter your lastname"/>
      </div>

      <div>
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter your password">
      </div>

      <div>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="example@gmail.com">
      </div>
      <div>
        <label for="number">Number:</label>
        <input type="number" id="number" placeholder="+977 900000000">
      </div>

      <div>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="male">

        <label for="female">female</label>
        <input type="radio" name="gender" id="female">
      </div>

      <div>
        <label for="">football</label>
        <input type="checkbox" name="" id="">

        <label for="">basketball</label>
        <input type="checkbox" name="" id="">

        <label for="">cricket</label>
        <input type="checkbox" name="" id="">

        <label for="">volleybal</label>
        <input type="checkbox" name="" id="">
      </div>

      <div>
        <label for="country">Country</label>
        <select id="country">
            <option value="nepal">Nepal</option>
            <option value="india">India</option>
            <option value="china">China</option>
        </select>
      </div>

      <div>
        <label for="textarea">textarea</label>
        <textarea id="textarea" rows="10" cols="20"></textarea>
      </div>

      <div>
        <label for="">upload file: </label>
        <input type="file" name="" id="">
      </div>

      <div>
        <label for="">Date:</label>
        <input type="date" name="" id="">
      </div>

      <input type="submit" name="" id="">


    </form>
  </body>
</html>
