<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
    /* last  classs we cover thses three: */
        /* element/tag selector  div/span/p */
        /* class selector  . */
        /* id selector # */

/* today we cover these: */
        /* universal selector '*'  */
        *{
            margin: 0;
            padding: 0;
        }


        /* child selector > */

        div >p{
            /* color: red; */
        }


        /* descendent  selector ' ' */
        div article p{
            color: blue;
        }

        div a{
            color: red;
            font-weight: 600;
            font-size: 32px;
        }

        /* pseudo selector  ':' */
        /* hover */
        div article a:hover{
            color: green;
        }

        div article a:active{
            color: black;
        }
        div article a:visited{
            color: yellow;
        }

        button{
            background-color: blue;
            color: white;
            padding: 5px 10px;
            border-radius: 10px;
            border:none;
            cursor: pointer;
            margin-top: 10px;
            margin-left: 10px;
            transition: all 0.3s ease-in-out;
        }

        button:hover{
            scale: 1.5;
        }

        button:active{
            scale: 1;
        }


        /* multiple selections ',' */
        p, h4, section{
            color: red;
            background: yellow;
            font-size: 30px;
            font-weight: 600;
        }
        

    </style>
</head>
<body>

</html>
