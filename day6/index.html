<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>id and class in html</title>

    <style>
        .box2{
            color: red;
        }

        #box{
            color: blue;
        }
    </style>
</head>
<body>
    <!-- id and class -->
     <!-- id -> is a unique attribute for any element -->
      <!-- class -> can be given to the multiple element -->
    <div id="box"> id box
    </div>

    <div class="box2">i am a div
    </div>
    <h1 class="box2">h1</h1>
    <p class="box2">p</p>

</body>
</html>
