<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list in html</title>
</head>
<body>

    <!-- list in html -->

    <!-- ordered list -->

    <ol>
        <li>Apple</li>
        <li>Banana</li>
        <li>orange</li>
    </ol>


    <!-- unordered list -->
    <ul>
        <li>Ball</li>
        <li>cat</li>
    </ul>
    
</body>
</html>
