<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>food item in table</title>
</head>
<body>

    <table border="1">
        <tr>
            <th>S.N.</th>
            <th>Category</th>
            <th>Items</th>
            <th>Price</th>
        </tr>

        <tr>
            <td rowspan="2">1</td>
            <td rowspan="2">Pizza</td>
            <td>veg. pizza</td>
            <td>Rs.140</td>
        </tr>

        <tr>
            <td>Chicken Pizza</td>
            <td>Rs.200</td>
        </tr>
        <tr>
            <td rowspan="2">2</td>
            <td rowspan="2">Burger</td>
            <td>veg. Burger</td>
            <td>Rs.150</td>
        </tr>

        <tr>
            <td>Chicken Burger</td>
            <td>Rs.200</td>
        </tr>
        <tr>
            <td rowspan="3">3</td>
            <td rowspan="3">Ice-Cream</td>
            <td>Chocolate Ice-cream</td>
            <td>Rs.140</td>
        </tr>

        <tr>
            <td>vanilla Ice-Cream</td>
            <td>Rs.200</td>
        </tr>
        <tr>
            <td>StrawBerry Ice-Cream</td>
            <td>Rs.200</td>
        </tr>
    </table>
    
</body>
</html>
