<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            padding: 0;
            margin: 0;
        }
        header{
            background-color: rgb(68, 67, 67);
            color: white;
            padding: 10px 15px;
        }
        nav{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav ul{
            display: flex;
            gap: 10px;
        }

        nav ul li{
            list-style-type: none;
        }

        .logo{
            font-weight: bold;
            font-size: 22px;
        }

        footer{
            background-color: rgb(68, 67, 67);
            color: white;
            padding: 15px;
            position:fixed;
            right: 0;
            left: 0;
            bottom: 0;
            text-align: center;
        }

    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                logo
            </div>
            <ul>
                <li>Home</li>
                <li>Menu</li>
                <li>About</li>
                <li>Contact</li>
            </ul>

        </nav>
    </header>

    <main>

    </main>

    <footer>
        <p>FOOTER</p>
    </footer>
</body>
</html>
