<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box in html</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        .container{
            height: 100vh;
            width: 100%;
            background-color: aqua;
            padding: 10px;
            display: flex;
            justify-content:space-between; 
            align-items:start;
            gap: 10px;
        }

        .box{
            height: 50px;
            width: 50px;
            background-color: red;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">box 1</div>
        <div class="box">box 2</div>
        <div class="box">box 4</div>
    </div>
</body>
</html>
